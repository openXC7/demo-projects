# Heavy end-to-end test (Tier 1, slow projects)
#
# Nightly build of the big demo projects (picosoc, LiteX DDR designs).
# Same toolchain + chipdb flow as smoke.yml, but these place-and-route
# runs take tens of minutes each, so this runs on a schedule instead of
# on every PR.  One job per project, so the nightly overview shows
# exactly which subprojects succeed and fail.
#
# Projects excluded here and why:
#   vexriscv_smp: no Makefile
#   blinky-colorlight: ECP5 (colorlight_i5), not a Xilinx 7-series project
#
# litex-ddr-hdmi-* are included: their Makefiles now take the db and
# bbaexport paths from the devshell environment (PRJXRAY_DB_DIR,
# NEXTPNR_XILINX_PYTHON_DIR) instead of the obsolete snap layout.

name: heavy

on:
  schedule:
    - cron: "15 2 * * *" # nightly 02:15 UTC
  workflow_dispatch:

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_NIX_REPO: openXC7/toolchain-nix
  VEXRISCV_REPO: SpinalHDL/VexRiscv

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: chipdb for the families the heavy projects need.
  # ---------------------------------------------------------------------
  chipdb:
    name: chipdb-${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # The chipdb output contains one .bin per footprint (e.g.
          # xc7k325tffg900.bin), so we copy them all; each project
          # Makefile picks its part via ${UPPER}_CHIPDB.
          - family: artix7
          - family: kintex7
          - family: spartan7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_NIX_REPO }}
          path: toolchain-nix
      - uses: DeterminateSystems/nix-installer-action@v14
      # v8+ caches through FlakeHub; the token comes from the
      # FLAKEHUB_TOKEN repo secret.  (The secrets context is not
      # available in step-level if: conditions, so no guard step.)
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        env:
          FLAKEHUB_TOKEN: ${{ secrets.FLAKEHUB_TOKEN }}

      - name: Build chipdb (${{ matrix.family }})
        id: build
        run: |
          set -euo pipefail
          OUT=$(nix build ./toolchain-nix#nextpnr-xilinx-chipdb.${{ matrix.family }} \
            --print-out-paths --no-link)
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cp "$OUT"/*.bin "$GITHUB_WORKSPACE/stage/"
          ls -la "$GITHUB_WORKSPACE/stage"
          echo "stage=$GITHUB_WORKSPACE/stage" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: chipdb-${{ matrix.family }}
          path: ${{ steps.build.outputs.stage }}
          retention-days: 3

  # ---------------------------------------------------------------------
  # Stage 2: one job per heavy project.
  # ---------------------------------------------------------------------
  project:
    name: ${{ matrix.project }}
    needs: chipdb
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: kintex7
            upper: KINTEX7
            project: picosoc
            vexriscv: false
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-kc705
            vexriscv: true
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-stlv7325
            vexriscv: false
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-enclustra-kx2
            vexriscv: false
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-hdmi-stlv7325
            vexriscv: true
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-hdmi-enclustra-kx2
            vexriscv: true
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-qmtech-kintex7
            vexriscv: true
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-hpcstore-k420t
            vexriscv: false
          - family: artix7
            upper: ARTIX7
            project: litex-ddr-qmtech-artix7
            vexriscv: true
            # known-failing: BRAM/LUTFF legaliser spiral (a7-only)
          - family: artix7
            upper: ARTIX7
            project: litex-sata-alientek-davincipro
            vexriscv: true
          - family: spartan7
            upper: SPARTAN7
            project: litex-ddr-arty-s7
            vexriscv: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_NIX_REPO }}
          path: toolchain-nix
      # ../vexriscv is required by the projects that include VexRiscv.v
      - uses: actions/checkout@v4
        if: matrix.vexriscv
        with:
          repository: ${{ env.VEXRISCV_REPO }}
          path: vexriscv
      - uses: actions/download-artifact@v4
        with:
          name: chipdb-${{ matrix.family }}
          path: chipdb
      - uses: DeterminateSystems/nix-installer-action@v14
      # v8+ caches through FlakeHub; the token comes from the
      # FLAKEHUB_TOKEN repo secret.  (The secrets context is not
      # available in step-level if: conditions, so no guard step.)
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        env:
          FLAKEHUB_TOKEN: ${{ secrets.FLAKEHUB_TOKEN }}

      - name: Build project
        env:
          CHIPDB_DIR: ${{ github.workspace }}/chipdb
          UPPER: ${{ matrix.upper }}
          PROJECT: ${{ matrix.project }}
          # picosoc selects its part via BOARD (genesys2 here); the other
          # projects only use BOARD for the `program` target, which we
          # never invoke in CI.
          BOARD: genesys2
        run: |
          export ${UPPER}_CHIPDB="$CHIPDB_DIR"
          nix develop ./toolchain-nix --command bash -euxo pipefail <<'EOF'
            echo "=== building $PROJECT (timeout 90 min) ==="
            timeout 5400 make -C "$PROJECT"
            ls -la "$PROJECT"/*.bit
          EOF
