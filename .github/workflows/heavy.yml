# Heavy end-to-end test: the slow project that smoke.yml cannot cover
#
# Every demo project except litex-ddr-hpcstore-k420t is built by
# smoke.yml on every push and PR.  hpcstore-k420t lives here alone: its
# place-and-route currently fails (unable to find legal placement for a
# data_mem grain cell on xc7k420t) and its runs far exceed the 120 min
# per-job timeout in smoke.yml, so it gets a 360 min timeout here.
#
# Nightly cron (02:15 UTC) is gated on commit activity since the last
# completed heavy run.  The gate looks up the most recent completed run
# of this workflow and proceeds only when one of the three repos the
# heavy build depends on (demo-projects, toolchain-nix, nextpnr-xilinx)
# received commits after that run.  The first run (no completed run
# yet) always proceeds.  prjxray is deliberately NOT in the list: it
# receives commits daily and previously made the gate always-true.
# workflow_dispatch always runs.
#
# One job per project keeps the overview readable even though there is
# only one project today; if another too-slow-for-smoke project appears,
# add it to the matrix, not to smoke.yml.

name: heavy

on:
  schedule:
    - cron: "15 2 * * *" # nightly 02:15 UTC
  workflow_dispatch:

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_NIX_REPO: openXC7/toolchain-nix
  # Single source of truth for the toolchain revision: both jobs (chipdb
  # and project) MUST resolve this exact rev. Bump it and regenerate the
  # golden bitstreams together (update-goldens input).
  TOOLCHAIN_NIX_REV: 4f78e461347b52e35c53e6f235ed2b5b96afe5a9

jobs:

  # ---------------------------------------------------------------------
  # Stage 0: activity gate for the nightly cron.  Determines the most
  # recent completed run of this workflow and checks for commits in the
  # three repos the build depends on (demo-projects, toolchain-nix,
  # nextpnr-xilinx) since that run.  Skips the pipeline when nothing
  # changed; the first run (no prior completed run) always proceeds.
  # Manual dispatches always proceed.  prjxray is excluded: its daily
  # commits made the gate always-true.
  # ---------------------------------------------------------------------
  gate:
    name: recent-changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check for commits since the last completed run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(gh api "repos/${{ github.repository }}/actions/workflows/heavy.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].created_at')"
          # jq prints "null" (not empty) when there is no completed run yet.
          if [ -z "$since" ] || [ "$since" = "null" ]; then
            echo "no previous completed heavy run; forcing first run"
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "last completed heavy run: $since"
          repos="openXC7/nextpnr-xilinx openXC7/demo-projects openXC7/toolchain-nix"
          changed=no
          for repo in $repos; do
            count="$(gh api "repos/$repo/commits?since=$since&per_page=1" --jq 'length')"
            echo "$repo: $count commit(s) since $since"
            if [ "$count" -gt 0 ]; then
              changed=yes
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Stage 1: chipdb for the families the heavy projects need.
  # ---------------------------------------------------------------------
  chipdb:
    name: chipdb-${{ matrix.family }}
    needs: gate
    if: github.event_name != 'schedule' || needs.gate.outputs.changed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # The chipdb output contains one .bin per footprint (e.g.
          # xc7k325tffg900.bin), so we copy them all; each project
          # Makefile picks its part via ${UPPER}_CHIPDB.
          - family: kintex7
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      # v6: the last release before the FlakeHub cache requirement --
      # uses the native GitHub Actions cache directly, no token needed.
      - uses: DeterminateSystems/magic-nix-cache-action@v6

      - name: Build chipdb (${{ matrix.family }})
        id: build
        run: |
          set -euo pipefail
          OUT=$(nix build "github:${TOOLCHAIN_NIX_REPO}/${TOOLCHAIN_NIX_REV}#nextpnr-xilinx-chipdb.${{ matrix.family }}" \
            --print-out-paths --no-link)
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cp "$OUT"/*.bin "$GITHUB_WORKSPACE/stage/"
          ls -la "$GITHUB_WORKSPACE/stage"
          echo "stage=$GITHUB_WORKSPACE/stage" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: chipdb-${{ matrix.family }}
          path: ${{ steps.build.outputs.stage }}
          retention-days: 3

  # ---------------------------------------------------------------------
  # Stage 2: one job per heavy project.
  # ---------------------------------------------------------------------
  project:
    name: ${{ matrix.project }}
    needs: chipdb
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-hpcstore-k420t
    steps:
      - uses: actions/checkout@v4
      # The projects reference ../vexriscv/VexRiscv.v; the generated
      # Verilog is vendored in this repo (upstream SpinalHDL/VexRiscv
      # only ships the Scala sources), so no separate checkout.
      - uses: actions/download-artifact@v4
        with:
          name: chipdb-${{ matrix.family }}
          path: chipdb
      - uses: DeterminateSystems/nix-installer-action@v14
      # v6: the last release before the FlakeHub cache requirement --
      # uses the native GitHub Actions cache directly, no token needed.
      - uses: DeterminateSystems/magic-nix-cache-action@v6

      - name: Build project
        env:
          CHIPDB_DIR: ${{ github.workspace }}/chipdb
          UPPER: ${{ matrix.upper }}
          PROJECT: ${{ matrix.project }}
          # picosoc selects its part via BOARD (kx2 here); the other
          # projects only use BOARD for the `program` target, which we
          # never invoke in CI.
          BOARD: kx2
        run: |
          set -o pipefail
          export ${UPPER}_CHIPDB="$CHIPDB_DIR"
          nix develop "github:${TOOLCHAIN_NIX_REPO}/${TOOLCHAIN_NIX_REV}" --command bash -euxo pipefail <<'EOF' 2>&1 | tee "$PROJECT/build.log"
            echo "=== building $PROJECT (timeout 90 min) ==="
            timeout 5400 make -C "$PROJECT"
            ls -la "$PROJECT"/*.bit
          EOF
          exit $?

      - name: Upload build artifacts (bitstream + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-artifacts
          path: |
            ${{ matrix.project }}/*.bit
            ${{ matrix.project }}/build.log
          if-no-files-found: warn
          retention-days: 7
