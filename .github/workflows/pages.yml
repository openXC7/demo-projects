# Render the demo project test matrix as a static HTML dashboard and
# deploy it to GitHub Pages, plus embed the same matrix into README.md.
#
# Regenerates whenever the smoke or heavy workflow completes, nightly,
# or on demand.  The README commit only touches README.md, which smoke
# excludes via paths-ignore, so there is no retrigger loop.
#
# Prerequisite for the Pages half: enable Pages with source "GitHub
# Actions" (Settings -> Pages -> Build and deployment -> Source).
# The dashboard then lives at https://<owner>.github.io/demo-projects/
#
# workflow_run is restricted to the repo's own smoke/heavy workflows
# (zizmor: ignore[dangerous-triggers]); payload (job names, URLs) is
# rendered only for runs on the default branch and escaped before
# embedding.
#
# The nightly cron is gated on repository activity like heavy.yml: it
# only proceeds when at least one involved repo (demo-projects,
# toolchain-nix, nextpnr-xilinx, prjxray) received commits within the
# previous 24h.  workflow_run and workflow_dispatch are event-driven
# and always run.

name: pages

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [smoke, heavy]
    types: [completed]
  schedule:
    - cron: "45 2 * * *" # nightly 02:45 UTC, after the heavy run
  workflow_dispatch:

permissions:
  contents: write # commit the README matrix section
  actions: read # gh api .../actions/workflows and run/job lookups
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Activity gate for the nightly cron; see heavy.yml Stage 0 for the
  # rationale.  The other triggers are event-driven and always proceed.
  gate:
    name: recent-changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check for commits in the last 24h
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          repos="openXC7/demo-projects openXC7/toolchain-nix openXC7/nextpnr-xilinx openXC7/prjxray"
          changed=no
          for repo in $repos; do
            count="$(gh api "repos/$repo/commits?since=$since&per_page=1" --jq 'length')"
            echo "$repo: $count commit(s) in the last 24h"
            if [ "$count" -gt 0 ]; then
              changed=yes
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  matrix-report:
    needs: gate
    if: github.event_name != 'schedule' || needs.gate.outputs.changed == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect and render matrix report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/matrix_report.py

      - name: Commit updated README matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README matrix unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "ci: update README test matrix"
          git pull --rebase origin main || true
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
