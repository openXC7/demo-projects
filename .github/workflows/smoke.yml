# End-to-end toolchain test (Tiers 1 + 2)
#
# 1. Builds the full toolchain (nextpnr-xilinx + prjxray + fasm + chipdb)
#    from the latest toolchain-nix flake.
# 2. Builds every demo project to a .bit file
#    (yosys -> nextpnr-xilinx -> fasm2frames -> xc7frames2bit).
#    One job per project, so the CI overview shows exactly which
#    subprojects in demo-projects succeed and fail.
# 3. Compares regenerated .bit files against the golden .bit files
#    committed in the repo (regression check; skipped when no golden
#    exists for the project).
# 4. Rebuilds one project per family and checks bitstream determinism.
# 5. A summary job renders the per-project pass/fail table.
#
# Layout: the chipdb stage is the long pole (bbaexport takes 1-3 h per
# family on first run); the magic-nix-cache action makes repeat runs
# with an unchanged toolchain fast.
#
# workflow_dispatch input `update-goldens: true`:
#   skips the golden-compare failure, uploads the freshly built .bit
#   files as an artifact so they can be committed manually.
#
# Known-failing projects are kept in the matrix on purpose: the point of
# the overview is to show their status.  litex-ddr-hpcstore-k420t
# currently fails in placement (unable to find legal placement for a
# data_mem grain cell on xc7k420t).

name: smoke

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      update-goldens:
        description: "Regenerate golden bitstreams: skip compare failure, upload new .bit files as artifact"
        type: boolean
        default: false

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sibling repo used to build the toolchain. Change if you fork.
  TOOLCHAIN_NIX_REPO: openXC7/toolchain-nix

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: build the toolchain + chipdb for one family per job.
  # ---------------------------------------------------------------------
  chipdb:
    name: chipdb-${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # The chipdb output contains one .bin per footprint (e.g.
          # xc7k325tffg900.bin), so we copy them all; each project
          # Makefile picks its part via ${UPPER}_CHIPDB.
          - family: artix7
          - family: kintex7
          - family: spartan7
          - family: zynq7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_NIX_REPO }}
          path: toolchain-nix
      - uses: DeterminateSystems/nix-installer-action@v14
      # v6: the last release before the FlakeHub cache requirement --
      # uses the native GitHub Actions cache directly, no token needed.
      - uses: DeterminateSystems/magic-nix-cache-action@v6

      - name: Build chipdb (${{ matrix.family }})
        id: build
        run: |
          set -euo pipefail
          OUT=$(nix build ./toolchain-nix#nextpnr-xilinx-chipdb.${{ matrix.family }} \
            --print-out-paths --no-link)
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cp "$OUT"/*.bin "$GITHUB_WORKSPACE/stage/"
          ls -la "$GITHUB_WORKSPACE/stage"
          echo "stage=$GITHUB_WORKSPACE/stage" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: chipdb-${{ matrix.family }}
          path: ${{ steps.build.outputs.stage }}
          retention-days: 3

  # ---------------------------------------------------------------------
  # Stage 2a: one job per demo project.  The GitHub job list IS the
  # overview: green = the project builds to .bit, red = it does not.
  # ---------------------------------------------------------------------
  project:
    name: ${{ matrix.project }}
    needs: chipdb
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- blinky / small demos (with committed golden bitstreams) ---
          - family: artix7
            upper: ARTIX7
            project: blinky-digilent-arty
          - family: artix7
            upper: ARTIX7
            project: blinky-digilent-basys-3
          - family: kintex7
            upper: KINTEX7
            project: blinky-genesys2
          - family: kintex7
            upper: KINTEX7
            project: blinky-kc705
          - family: kintex7
            upper: KINTEX7
            project: blinky-qmtech
          - family: kintex7
            upper: KINTEX7
            project: blinky-stlv7325
          - family: zynq7
            upper: ZYNQ7
            project: blinky-digilent-zybo
          - family: spartan7
            upper: SPARTAN7
            project: ddr3-test-arty-s7
          # --- litex-ddr / SoC-class demos (no goldens, gate on the build) ---
          - family: spartan7
            upper: SPARTAN7
            project: litex-ddr-arty-s7
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-qmtech-kintex7
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-enclustra-kx2
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-stlv7325
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-kc705
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-hdmi-stlv7325
          - family: kintex7
            upper: KINTEX7
            project: litex-ddr-hdmi-enclustra-kx2
          - family: kintex7
            upper: KINTEX7
            project: picosoc
          - family: artix7
            upper: ARTIX7
            project: litex-ddr-qmtech-artix7
          - family: artix7
            upper: ARTIX7
            project: litex-sata-alientek-davincipro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_NIX_REPO }}
          path: toolchain-nix
      # The projects reference ../vexriscv/VexRiscv.v; the generated
      # Verilog is vendored in this repo (upstream SpinalHDL/VexRiscv
      # only ships the Scala sources), so no separate checkout.
      - uses: actions/download-artifact@v4
        with:
          name: chipdb-${{ matrix.family }}
          path: chipdb
      - uses: DeterminateSystems/nix-installer-action@v14
      # v6: the last release before the FlakeHub cache requirement --
      # uses the native GitHub Actions cache directly, no token needed.
      - uses: DeterminateSystems/magic-nix-cache-action@v6

      - name: Build project and compare against golden
        env:
          CHIPDB_DIR: ${{ github.workspace }}/chipdb
          UPPER: ${{ matrix.upper }}
          PROJECT: ${{ matrix.project }}
          UPDATE_GOLDENS: ${{ inputs.update-goldens == true }}
        run: |
          export ${UPPER}_CHIPDB="$CHIPDB_DIR"
          nix develop ./toolchain-nix --command bash -euxo pipefail <<'EOF'
            # xc7frames2bit stamps the .bit header with the build date/time,
            # so byte-exact hashes can never match across builds.  Blank the
            # header timestamp ('c'/'d' TLV sections) before hashing.
            normhash() { python3 .github/scripts/normbit.py "$1"; }

            # stash the committed golden bitstream before make overwrites it
            if ls "$PROJECT"/*.bit >/dev/null 2>&1; then
              cp "$PROJECT"/*.bit /tmp/golden
            fi

            echo "=== building $PROJECT ==="
            make -C "$PROJECT"
            ls -la "$PROJECT"/*.bit

            # regression check against the committed golden bitstream
            if [ ! -f /tmp/golden ]; then
              echo "no golden bitstream for $PROJECT, skipping compare"
              exit 0
            fi
            new=$(normhash "$PROJECT"/*.bit)
            old=$(normhash /tmp/golden)
            if [ "$new" != "$old" ]; then
              echo "::warning::bitstream for $PROJECT differs from committed golden"
              if [ "$UPDATE_GOLDENS" != "true" ]; then
                echo "::error::$PROJECT: rebuilt bitstream differs from committed golden (normalized sha256 $old vs $new)."
                echo "Run the workflow with update-goldens=true to regenerate, then commit."
                exit 1
              fi
              mkdir -p "$GITHUB_WORKSPACE/regenerated-goldens/$PROJECT"
              cp "$PROJECT"/*.bit "$GITHUB_WORKSPACE/regenerated-goldens/$PROJECT/"
            fi
          EOF

      - name: Upload regenerated golden bitstreams
        if: inputs.update-goldens == true
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: regenerated-goldens

  # ---------------------------------------------------------------------
  # Stage 2b: determinism check (rebuild one project per family).
  # ---------------------------------------------------------------------
  determinism:
    name: determinism-${{ matrix.family }}
    needs: chipdb
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: artix7
            upper: ARTIX7
            project: blinky-digilent-arty
          - family: kintex7
            upper: KINTEX7
            project: blinky-qmtech
          - family: zynq7
            upper: ZYNQ7
            project: blinky-digilent-zybo
          - family: spartan7
            upper: SPARTAN7
            project: ddr3-test-arty-s7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_NIX_REPO }}
          path: toolchain-nix
      - uses: actions/download-artifact@v4
        with:
          name: chipdb-${{ matrix.family }}
          path: chipdb
      - uses: DeterminateSystems/nix-installer-action@v14
      # v6: the last release before the FlakeHub cache requirement --
      # uses the native GitHub Actions cache directly, no token needed.
      - uses: DeterminateSystems/magic-nix-cache-action@v6

      - name: Determinism check
        env:
          CHIPDB_DIR: ${{ github.workspace }}/chipdb
          UPPER: ${{ matrix.upper }}
          PROJECT: ${{ matrix.project }}
        run: |
          export ${UPPER}_CHIPDB="$CHIPDB_DIR"
          nix develop ./toolchain-nix --command bash -euxo pipefail <<'EOF'
            normhash() { python3 .github/scripts/normbit.py "$1"; }
            first=$(normhash "$PROJECT"/*.bit)
            make -C "$PROJECT" clean
            make -C "$PROJECT"
            second=$(normhash "$PROJECT"/*.bit)
            if [ "$first" != "$second" ]; then
              echo "::error::$PROJECT: nondeterministic build (normalized sha256 $first vs $second)"
              exit 1
            fi
            echo "determinism ok: $PROJECT ($first)"
          EOF

  # ---------------------------------------------------------------------
  # Stage 3: per-project results are visible in the job list itself:
  # the project matrix spawns one job per demo, so the workflow run
  # page shows exactly which subprojects succeeded and which failed.
  # (A needs.<matrix>.results table would duplicate the native view;
  # kept out because the schema linter does not model .results.)
  # ---------------------------------------------------------------------
