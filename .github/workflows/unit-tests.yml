# Unit tests (Tier 3)
#
# Runs the nextpnr-xilinx gtest suite with the build dependencies from
# the toolchain-nix flake (`ci-tests` devshell).
#
# NOTE: this job is currently blocked on nextpnr-xilinx: the ARCH=generic
# test target does not compile (the fork's common/ code has drifted from
# its generic arch -- missing getBelHidden, wireIntent, ...).  See the
# openXC7/nextpnr-xilinx issue tracker; do not expect a green run until
# that is fixed.  The workflow-side commands below are already correct.
#
# What is *not* tested here, and why:
#   - nextpnr-xilinx ARCH=xilinx unit tests: there is no tests/xilinx
#     directory in the nextpnr-tests submodule, and CMake's
#     aux_source_directory() fails at configure time when the directory
#     is missing.
#   - Even for ARCH=generic the "suite" is only a compile smoke test:
#     tests/generic/ contains a bare gtest main() with no test cases.
#   - fasm pytest: the nix package sets doCheck = false ("broken
#     upstream", see toolchain-nix/nix/fasm/default.nix).
#   - prjxray: the tests/ directory only contains test_util.py.

name: unit-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_NIX_REPO: openXC7/toolchain-nix
  NEXTPNR_XILINX_REPO: openXC7/nextpnr-xilinx

jobs:
  nextpnr-gtest:
    name: nextpnr-xilinx gtest (generic)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_NIX_REPO }}
          path: toolchain-nix
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Test the exact revision the flake pins, not a hand-maintained
      # constant that drifts out of sync (this bit us: the hardcoded ref
      # was months old while toolchain-nix pinned the current tip).
      - name: Resolve pinned nextpnr-xilinx revision
        id: rev
        run: echo "rev=$(nix eval --raw ./toolchain-nix#nextpnr-xilinx.src.rev)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NEXTPNR_XILINX_REPO }}
          ref: ${{ steps.rev.outputs.rev }}
          path: nextpnr-xilinx
      # The tests/ submodule (YosysHQ/nextpnr-tests) is the only one
      # needed for the test build; skip the large prjxray-db submodule.
      - name: Fetch tests submodule
        run: git -C nextpnr-xilinx submodule update --init --depth 1 tests

      - name: Build and run gtest suite
        run: |
          # The flake exposes `ci-tests` as a top-level per-system attrset
          # (not under devShells), so nix develop needs the explicit
          # .x86_64-linux suffix.
          nix develop ./toolchain-nix#ci-tests.x86_64-linux --command bash -euxo pipefail -c '
            # cmake >= 4 removed compatibility with cmake_minimum_required < 3.5,
            # which the bundled googletest still uses.
            cmake -S nextpnr-xilinx -B build \
              -DARCH=generic \
              -DBUILD_TESTS=ON \
              -DBUILD_GUI=OFF \
              -DUSE_OPENMP=ON \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build --parallel 2
            ctest --test-dir build --output-on-failure
          '
