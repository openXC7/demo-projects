# Alinx AL321 USB-JTAG cable: an FT232H in MPSSE mode.
# With several FTDI devices attached, add: adapter serial <serial number>
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0008 0x000b
reset_config none
adapter speed 100
transport select jtag

# The 7-series TAP: 6-bit instruction register, USER1 = 0x02.
set CHIPNAME xc7
source [find cpld/xilinx-xc7.cfg]
